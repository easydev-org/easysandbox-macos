# easyworker: expose the guest-only per-pod env endpoint (/env) on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    # Per-pod env for the guest launcher: WORKER_TOKEN=... and SANDBOX_PROXY=...
    # (KEY=VALUE lines). The guest does not inherit the pod env, so anything it
    # needs — the pre-auth token and the deployment HTTP proxy — travels here.
    location = /env {
        alias /run/shm/env;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # THE BOOTSTRAP (must stay separate). The golden disk carries exactly one
    # launch file, /Users/docker/bootstrap.sh, which can only do one thing: fetch
    # a script and exec it. That script is oem.sh, so oem.sh must be reachable on
    # its own — it cannot come out of the tar, because fetching the tar is what
    # oem.sh itself does.
    location = /oem.sh {
        alias /opt/easyworker/oem.sh;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # ONE endpoint for the rest of the boot payload: the worker, easystream and the
    # audio helper, packed into a single tar by start.sh at container boot.
    #
    # This replaces a location per file (/worker, /easystream, /blackhole,
    # /aggregate). One request instead of four means the guest has a single place
    # to fetch from, a single failure to report, and sandbox.sh owns the manifest
    # — adding a payload no longer means editing nginx.
    #
    # The tar is built at boot (not baked) because it must contain the very files
    # this image ships, and a stale baked tar could disagree with them.
    location = /files {
        alias /run/shm/files.tar;
        default_type application/x-tar;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
