# agent-worker: expose the guest-only per-pod env endpoint (/env) on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    # Per-pod env for the guest launcher: WORKER_TOKEN=... and SANDBOX_PROXY=...
    # (KEY=VALUE lines). The guest does not inherit the pod env, so anything it
    # needs — the pre-auth token and the deployment HTTP proxy — travels here.
    location = /env {
        alias /run/shm/env;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the guest launcher downloads the current agent-worker binary
    # here on every boot, so a worker upgrade is an image change, not a golden
    # disk change. The guest disk still carries a fallback copy.
    location = /worker {
        alias /opt/agent-worker/agent-worker;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # easystream (est://) daemon: boot-fetched like the worker.
    location = /easystream {
        alias /opt/agent-worker/easystream;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # The REAL launch logic. The on-disk loader (/Users/docker/bootstrap.sh, the
    # only launch file on the golden disk) fetches this every boot and runs it,
    # so every launch change is an image change.
    location = /oem.sh {
        alias /opt/agent-worker/oem.sh;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
