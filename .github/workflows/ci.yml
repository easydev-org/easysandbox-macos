name: ci

# Generated from release.yml by hand, keeping the build identical and
# changing only what a pre-release check needs:
#
#   * build on main and on every pull request, not on a tag — a workflow
#     cannot watch both (defining `branches` suppresses tag events and vice
#     versa), so release.yml stays tag-only and this file covers the rest;
#   * push under a throwaway pr-<n> / main-<sha> tag, so a pull request
#     publishes nothing anyone depends on, while the registry handoff — where
#     the large-layer failures actually happened — is still exercised;
#   * no release job: a PR must not create a GitHub Release.


# Build the macOS sandbox image and push it to ghcr.
#
# The image EMBEDS the golden guest disk (17 GiB). It is immutable golden state,
# so it belongs in a layer rather than in an artifact store a pod must reach at
# start-up; embedding also means a start is instant instead of a multi-GB fetch.
#
# The disk lives on ghcr as golden-macos:base (9 layers). This job pulls it,
# concatenates the layers in order, verifies the sha256 from the manifest
# annotation, and hands the file to the image build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/easydev-org/sandbox-macos
  # Resolved from the latest release at build time. Pinned values rot: the
  # Containerfile downloads .../releases/download/${EASYSTREAM_VERSION}/..., so a
  # stale tag becomes a 404 the next time a release is cut.
  WORKER_REPO: easydev-org/easyworker
  EASYSTREAM_REPO: easydev-org/easystream-macos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve release versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          w=$(gh release view --repo "$WORKER_REPO" --json tagName -q .tagName)
          e=$(gh release view --repo "$EASYSTREAM_REPO" --json tagName -q .tagName)
          echo "worker=$w easystream=$e"
          echo "worker=$w" >> "$GITHUB_OUTPUT"
          echo "easystream=$e" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The Containerfile reads disk/support/, but the boot identity files are
      # tracked under xcode/support/ (build.sh used to stage them; a plain
      # `docker build` has no such step).
      - name: stage disk support files
        run: |
          set -euo pipefail
          mkdir -p disk
          # COPY, not a symlink: Docker does not follow symlinks inside the build
          # context when resolving a COPY source, so a link reproduces the very
          # "not found" it was meant to prevent.
          cp -a xcode/support disk/support
          ls -l disk/support/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The golden disk is NOT downloaded here.
      #
      # The Containerfile does `FROM ghcr.io/easydev-org/golden-disk-macos:base AS
      # golden` and reassembles the qcow2 inside that stage, so BuildKit pulls the
      # pieces with its own registry client. That matters at this size: 17 GiB of
      # pieces plus a 17 GiB joined file is 34 GiB, and a runner has ~30 GiB free.

      # 17 GiB disk + build layers. A stock runner has ~30 GB free, which is
      # tight; drop the preinstalled toolchains that this build never uses.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            WORKER_VERSION=${{ steps.ver.outputs.worker }}
            EASYSTREAM_VERSION=${{ steps.ver.outputs.easystream }}
            RELEASE_CACHEBUST=${{ github.run_id }}
            # Overridable so a test build can point at a different disk.
            GOLDEN_DISK_IMAGE=ghcr.io/easydev-org/golden-disk-macos:base
          # NO build cache.
          #
          # `cache-to: type=gha` uploaded 17 GiB to the Actions cache after every
          # build for no benefit: the one expensive layer is the immutable disk,
          # which BuildKit already caches from its source image. The upload
          # roughly doubled the wall time of a build that had otherwise finished.
          cache-from: type=gha
