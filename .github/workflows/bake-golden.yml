name: bake-golden

# Produce the macOS golden disk this image boots.
#
# PRODUCE vs CONSUME. dockur/macos produces the disk. This repository consumes
# it - Containerfile takes GOLDEN_DISK_IMAGE and golden-disk.sh boots an overlay -
# so the bake lives here next to what uses it.
#
# WHY FOUR STEPS. GitHub has no streaming log API: /actions/jobs/{id}/logs
# redirects to a blob published only after the job ends, and is 403/404 while the
# job runs; /actions/runs/{id}/logs does not exist. The one live, documented
# progress signal is the step list from /actions/jobs/{id}, so the bake is split
# into prepare -> start -> wait -> extract. Inside wait a 30s heartbeat prints the
# qcow2 size, the only health signal visible from the host.
#
# x86_64 ONLY. dockur/macos pins qemu-system-x86_64 and its OpenCore tree ships
# X64/EFI only - there is no ARM64 variant to pick. ARM macOS needs Apple
# Virtualization.framework on Apple hardware, which a Linux runner is not, so the
# prepare step refuses immediately rather than failing an hour later.
#
# Versions: dockur maps 26/tahoe, 15/sequoia, 14/sonoma, 13/ventura, 12/monterey.
# VERSION is passed straight through, so adding one is a dispatch with a different
# value, not a code change.
#
# Manual only: a 40-90 minute install producing a ~50 GiB disk.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "macOS version for dockur (14, 15, 26 ...)"
        required: false
        default: "14"
      disk_size:
        description: "qcow2 capacity passed to dockur"
        required: false
        default: "96G"

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ github.event.inputs.version }}
      DISK_SIZE: ${{ github.event.inputs.disk_size }}
      ARCH: x64
      STORAGE: ${{ github.workspace }}/storage
      OUT: ${{ github.workspace }}/out/macos.qcow2
    steps:
      - uses: actions/checkout@v4
      # Fails in seconds on an unsupported host or arch, instead of after the
      # image download.
      - name: bake prepare
        run: sudo -E bash scripts/bake-golden.sh prepare
      - name: bake start container
        run: sudo -E bash scripts/bake-golden.sh start
      - name: bake wait for install
        run: sudo -E bash scripts/bake-golden.sh wait
      - name: bake extract disk
        run: sudo -E bash scripts/bake-golden.sh extract
      - name: debug container
        if: failure()
        run: |
          sudo docker ps -a || true
          sudo docker logs --tail 200 macbake 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-macos
          path: ${{ github.workspace }}/out/macos.qcow2
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
